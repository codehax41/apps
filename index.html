<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apps Suite - Codehax41</title>
  <style>
    :root {
      --bg: #0B0E17;
      --card-bg: #131A29;
      --gold: #F3C969;
      --text: #E2E8F0;
      --text-muted: #94A3B8;
      --border: #1E293B;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      margin: 0;
      padding: 0;
    }
    .header {
      background: linear-gradient(180deg, #161F36 0%, var(--bg) 100%);
      padding: 60px 20px 40px;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }
    .header h1 {
      margin: 0;
      font-size: 2.5rem;
      color: #FFFFFF;
      letter-spacing: -0.5px;
    }
    .header p {
      color: var(--text-muted);
      margin-top: 10px;
      font-size: 1.1rem;
    }
    .container {
      max-width: 820px;
      margin: 40px auto;
      padding: 0 20px 80px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-top: 24px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
      text-decoration: none;
      color: inherit;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
    }
    .card:hover {
      border-color: var(--gold);
      transform: translateY(-4px);
      box-shadow: 0 10px 30px rgba(243, 201, 105, 0.1);
    }
    .card-badge {
      display: inline-block;
      align-self: flex-start;
      padding: 3px 10px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      background: rgba(243, 201, 105, 0.15);
      color: var(--gold);
      margin-bottom: 12px;
    }
    .card h3 {
      color: #FFFFFF;
      margin: 0 0 8px 0;
      font-size: 1.3rem;
    }
    .card p {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin: 0 0 16px 0;
      flex-grow: 1;
    }
    .card-links {
      display: flex;
      gap: 12px;
      font-size: 0.85rem;
      border-top: 1px solid var(--border);
      padding-top: 12px;
    }
    .card-links a {
      color: var(--gold);
      text-decoration: none;
    }
    .card-links a:hover {
      text-decoration: underline;
    }
    .footer {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.85rem;
      padding: 30px 20px;
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>Codehax Apps Suite</h1>
    <p>Official Public & Legal Compliance Portals</p>
  </div>

  <div class="container">
    <div class="grid">
      <div class="card">
        <span class="card-badge">Production Live</span>
        <h3>Daivant AI Astrology</h3>
        <p>Enterprise dual-platform Vedic astrology, ephemeris calculations, Kundali matrices, and live Devi AI consultation.</p>
        <div class="card-links">
          <a href="astro_ai/index.html">Compliance Hub &rarr;</a>
          <a href="astro_ai/privacy_policy.html">Privacy</a>
          <a href="astro_ai/deletion_policy.html">Deletion</a>
        </div>
      </div>
    </div>
  </div>

  <div class="footer">
    &copy; 2026 Codehax41. All rights reserved.
  </div>

</body>
</html>
