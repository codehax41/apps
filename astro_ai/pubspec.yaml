name: astro_ai
description: "Daivant AI Astrology - Ethereal 3D Vedic Cosmic Operating System & Devi AI Oracle (iOS + Android)"
publish_to: "none"
version: 4.2.0+42

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  vector_math: ^2.1.4

  # Firebase Enterprise Cloud (Auth, Firestore, Remote State)
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4

  # Cloudflare Storage & Worker Gateway (R2 Objects, D1, Transcripts & Chats)
  http: ^1.2.2
  crypto: ^3.0.3
  intl: ^0.19.0

  # Hardware Sensors & 3D Gyroscope Perspective Transforms
  sensors_plus: ^5.0.1

  # Live AI Oracle Devi State Machine & Tilak Glow Animation
  rive: ^0.13.4

  # Zero-Knowledge Biometric Authentication (Face ID / BiometricPrompt Class 3)
  local_auth: ^2.2.0

  # Cross-Platform Monetization (Apple StoreKit 2 & Google Play Billing v7)
  in_app_purchase: ^3.2.0

  # Real-Time Voice Synthesis & Speech Recognition for Devi Oracle
  speech_to_text: ^6.6.1
  flutter_tts: ^4.0.2
  audioplayers: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/shaders/
    - assets/rive/
    - assets/icons/
    - assets/images/
